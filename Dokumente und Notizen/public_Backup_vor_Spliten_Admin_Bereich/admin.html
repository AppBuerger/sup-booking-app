<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SUP Admin</title>

  <style>
    :root {
      --background: #f3f7f8;
      --surface: #ffffff;
      --primary: #176b75;
      --primary-dark: #10545c;
      --text: #18323a;
      --muted: #64777d;
      --border: #d9e3e6;
      --danger: #b42318;
      --danger-dark: #8f1c13;
      --success-background: #eaf7ef;
      --error-background: #fdeceb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    .admin-container {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .admin-header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .panel {
      padding: 24px;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(24, 50, 58, 0.08);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .login-panel {
      max-width: 420px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      min-height: 43px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(23, 107, 117, 0.18);
      border-color: var(--primary);
    }

    button {
      min-height: 42px;
      padding: 9px 15px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .primary-button {
      color: #fff;
      background: var(--primary);
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    .secondary-button {
      color: var(--text);
      background: #e7eef0;
    }

    .secondary-button:hover {
      background: #dce6e8;
    }

    .delete-button {
      min-height: 36px;
      padding: 7px 11px;
      color: #fff;
      background: var(--danger);
    }

    .delete-button:hover {
      background: var(--danger-dark);
    }

    .login-actions,
    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(160px, 1fr));
      gap: 16px;
    }

    .bookings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 15px;
    }

    .bookings-header h2 {
      margin: 0;
    }

    .booking-count {
      padding: 7px 11px;
      border-radius: 999px;
      background: #e6f1f3;
      color: var(--primary-dark);
      font-weight: 700;
      white-space: nowrap;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #edf3f4;
      color: #334d54;
      font-size: 14px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #f8fbfb;
    }

    .device-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      background: #e7eef0;
    }

    .device-sup-1 {
      background: #dceeff;
    }

    .device-sup-2 {
      background: #dcf5e6;
    }

    .device-ruderboot {
      background: #fff0c7;
    }

    .device-paddelboot {
      background: #ffe1d4;
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 10px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: var(--success-background);
      color: #1d6b3a;
    }

    .message.error {
      background: var(--error-background);
      color: #a01f18;
    }

    .loading {
      padding: 25px;
      text-align: center;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 850px) {
      body {
        padding: 15px;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .filters {
        grid-template-columns:
          repeat(2, minmax(150px, 1fr));
      }
    }

    @media (max-width: 560px) {
      .panel {
        padding: 17px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .bookings-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .login-actions button,
      .filter-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="admin-container">
    <header class="admin-header">
      <div>
        <h1>SUP Admin</h1>
        <p>
          Buchungen verwalten und später auswerten
        </p>
      </div>
    </header>

    <div id="message" class="message"></div>

    <section
      id="loginPanel"
      class="panel login-panel"
    >
      <h2>Admin-Login</h2>

      <div class="form-group">
        <label for="adminKey">
          Admin-Schlüssel
        </label>

        <input
          id="adminKey"
          type="password"
          autocomplete="current-password"
          placeholder="Admin-Schlüssel eingeben"
        >
      </div>

      <div class="login-actions">
        <button
          id="loginButton"
          type="button"
          class="primary-button"
        >
          Anmelden
        </button>
      </div>
    </section>

    <div id="adminArea" class="hidden">
      <section class="panel">
        <h2>Buchungen filtern</h2>

        <div class="filters">
          <div class="form-group">
            <label for="dateFrom">
              Datum von
            </label>

            <input
              id="dateFrom"
              type="date"
            >
          </div>

          <div class="form-group">
            <label for="dateTo">
              Datum bis
            </label>

            <input
              id="dateTo"
              type="date"
            >
          </div>

          <div class="form-group">
            <label for="apartmentFilter">
              Appartement
            </label>

            <select id="apartmentFilter">
              <option value="">
                Alle Appartements
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="deviceFilter">
              Gerät
            </label>

            <select id="deviceFilter">
              <option value="">
                Alle Geräte
              </option>
            </select>
          </div>
        </div>

        <div class="filter-actions">
          <button
            id="filterButton"
            type="button"
            class="primary-button"
          >
            Filter anwenden
          </button>

          <button
            id="resetButton"
            type="button"
            class="secondary-button"
          >
            Filter zurücksetzen
          </button>

          <button
            id="logoutButton"
            type="button"
            class="secondary-button"
          >
            Abmelden
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="bookings-header">
          <h2>Alle Buchungen</h2>

          <span
            id="bookingCount"
            class="booking-count"
          >
            0 Buchungen
          </span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Datum</th>
                <th>Zeit</th>
                <th>Appartement</th>
                <th>Gerät</th>
                <th>Aktion</th>
              </tr>
            </thead>

            <tbody id="bookingTableBody">
              <tr>
                <td colspan="5" class="loading">
                  Buchungen werden geladen …
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    const loginPanel =
      document.getElementById("loginPanel");

    const adminArea =
      document.getElementById("adminArea");

    const adminKeyInput =
      document.getElementById("adminKey");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const filterButton =
      document.getElementById("filterButton");

    const resetButton =
      document.getElementById("resetButton");

    const dateFromInput =
      document.getElementById("dateFrom");

    const dateToInput =
      document.getElementById("dateTo");

    const apartmentFilter =
      document.getElementById("apartmentFilter");

    const deviceFilter =
      document.getElementById("deviceFilter");

    const bookingTableBody =
      document.getElementById("bookingTableBody");

    const bookingCount =
      document.getElementById("bookingCount");

    const messageBox =
      document.getElementById("message");

    let adminKey = "";
    let allBookings = [];
    let messageTimer;

    function showMessage(
      text,
      type = "success"
    ) {
      clearTimeout(messageTimer);

      messageBox.textContent = text;
      messageBox.className =
        `message show ${type}`;

      messageTimer = setTimeout(() => {
        messageBox.className = "message";
        messageBox.textContent = "";
      }, 5000);
    }

    function getDateValue(value) {
      if (!value) {
        return "";
      }

      return String(value).split("T")[0];
    }

    function formatDate(value) {
      const dateValue = getDateValue(value);

      if (!dateValue) {
        return "";
      }

      const [year, month, day] =
        dateValue.split("-");

      return `${day}.${month}.${year}`;
    }

    function formatTime(value) {
      if (!value) {
        return "";
      }

      return String(value).slice(0, 5);
    }

    function getDeviceClass(deviceName) {
      switch (deviceName) {
        case "SUP 1":
          return "device-sup-1";

        case "SUP 2":
          return "device-sup-2";

        case "Ruderboot":
          return "device-ruderboot";

        case "Paddelboot":
          return "device-paddelboot";

        default:
          return "";
      }
    }

    function createOption(value, text) {
      const option =
        document.createElement("option");

      option.value = value;
      option.textContent = text;

      return option;
    }

    function fillFilterOptions() {
      const selectedApartment =
        apartmentFilter.value;

      const selectedDevice =
        deviceFilter.value;

      const apartments = [
        ...new Set(
          allBookings
            .map((booking) => booking.appartement)
            .filter(Boolean)
        ),
      ].sort((a, b) =>
        String(a).localeCompare(
          String(b),
          "de",
          { numeric: true }
        )
      );

      const devices = [
        ...new Set(
          allBookings
            .map((booking) => booking.sup)
            .filter(Boolean)
        ),
      ].sort((a, b) =>
        String(a).localeCompare(String(b), "de")
      );

      apartmentFilter.innerHTML = "";
      apartmentFilter.appendChild(
        createOption("", "Alle Appartements")
      );

      apartments.forEach((apartment) => {
        apartmentFilter.appendChild(
          createOption(apartment, apartment)
        );
      });

      deviceFilter.innerHTML = "";
      deviceFilter.appendChild(
        createOption("", "Alle Geräte")
      );

      devices.forEach((device) => {
        deviceFilter.appendChild(
          createOption(device, device)
        );
      });

      apartmentFilter.value =
        apartments.includes(selectedApartment)
          ? selectedApartment
          : "";

      deviceFilter.value =
        devices.includes(selectedDevice)
          ? selectedDevice
          : "";
    }

    function getFilteredBookings() {
      const dateFrom = dateFromInput.value;
      const dateTo = dateToInput.value;
      const selectedApartment =
        apartmentFilter.value;

      const selectedDevice =
        deviceFilter.value;

      return allBookings
        .filter((booking) => {
          const bookingDate =
            getDateValue(booking.datum);

          if (
            dateFrom &&
            bookingDate < dateFrom
          ) {
            return false;
          }

          if (
            dateTo &&
            bookingDate > dateTo
          ) {
            return false;
          }

          if (
            selectedApartment &&
            booking.appartement !== selectedApartment
          ) {
            return false;
          }

          if (
            selectedDevice &&
            booking.sup !== selectedDevice
          ) {
            return false;
          }

          return true;
        })
        .sort((a, b) => {
          const dateComparison =
            getDateValue(a.datum).localeCompare(
              getDateValue(b.datum)
            );

          if (dateComparison !== 0) {
            return dateComparison;
          }

          return String(a.von).localeCompare(
            String(b.von)
          );
        });
    }

    function updateBookingCount(count) {
      bookingCount.textContent =
        count === 1
          ? "1 Buchung"
          : `${count} Buchungen`;
    }

    function renderBookings(bookings) {
      bookingTableBody.innerHTML = "";

      updateBookingCount(bookings.length);

      if (bookings.length === 0) {
        const row =
          document.createElement("tr");

        row.innerHTML = `
          <td colspan="5" class="empty-state">
            Für diese Auswahl wurden keine Buchungen gefunden.
          </td>
        `;

        bookingTableBody.appendChild(row);
        return;
      }

      bookings.forEach((booking) => {
        const row =
          document.createElement("tr");

        const dateCell =
          document.createElement("td");

        dateCell.textContent =
          formatDate(booking.datum);

        const timeCell =
          document.createElement("td");

        timeCell.textContent =
          `${formatTime(booking.von)}–` +
          `${formatTime(booking.bis)} Uhr`;

        const apartmentCell =
          document.createElement("td");

        apartmentCell.textContent =
          booking.appartement || "–";

        const deviceCell =
          document.createElement("td");

        const deviceBadge =
          document.createElement("span");

        deviceBadge.className =
          `device-badge ` +
          getDeviceClass(booking.sup);

        deviceBadge.textContent =
          booking.sup || "–";

        deviceCell.appendChild(deviceBadge);

        const actionCell =
          document.createElement("td");

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className =
          "delete-button";

        deleteButton.textContent = "Löschen";

        deleteButton.addEventListener(
          "click",
          () => deleteBooking(booking)
        );

        actionCell.appendChild(deleteButton);

        row.appendChild(dateCell);
        row.appendChild(timeCell);
        row.appendChild(apartmentCell);
        row.appendChild(deviceCell);
        row.appendChild(actionCell);

        bookingTableBody.appendChild(row);
      });
    }

    function applyFilters() {
      if (
        dateFromInput.value &&
        dateToInput.value &&
        dateFromInput.value >
          dateToInput.value
      ) {
        showMessage(
          "Das Von-Datum darf nicht nach dem Bis-Datum liegen.",
          "error"
        );

        return;
      }

      renderBookings(getFilteredBookings());
    }

    function resetFilters() {
      dateFromInput.value = "";
      dateToInput.value = "";
      apartmentFilter.value = "";
      deviceFilter.value = "";

      renderBookings(allBookings);
    }

    async function loadBookings() {
      bookingTableBody.innerHTML = `
        <tr>
          <td colspan="5" class="loading">
            Buchungen werden geladen …
          </td>
        </tr>
      `;

      const response =
        await fetch("/api/bookings");

      const result =
        await response
          .json()
          .catch(() => []);

      if (!response.ok) {
        throw new Error(
          result.message ||
          "Die Buchungen konnten nicht geladen werden."
        );
      }

      allBookings =
        Array.isArray(result) ? result : [];

      fillFilterOptions();
      renderBookings(getFilteredBookings());
    }

    async function login() {
      const enteredKey =
        adminKeyInput.value.trim();

      if (!enteredKey) {
        showMessage(
          "Bitte gib den Admin-Schlüssel ein.",
          "error"
        );

        return;
      }

      adminKey = enteredKey;

      loginButton.disabled = true;
      loginButton.textContent =
        "Anmeldung läuft …";

      const response = await fetch(
  "/api/admin/check",
  {
    headers: {
      "X-ADMIN-KEY": adminKey,
    },
  }
);

const result =
  await response
    .json()
    .catch(() => ({}));

if (!response.ok) {
  throw new Error(
    result.error ||
    "Der Admin-Schlüssel ist ungültig."
  );
}

await loadBookings();

        loginPanel.classList.add("hidden");
        adminArea.classList.remove("hidden");
      } catch (error) {
        console.error(error);

        showMessage(
          error.message ||
          "Der Adminbereich konnte nicht geladen werden.",
          "error"
        );
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Anmelden";
      }
    }

    function logout() {
      adminKey = "";
      adminKeyInput.value = "";

      adminArea.classList.add("hidden");
      loginPanel.classList.remove("hidden");

      allBookings = [];
      bookingTableBody.innerHTML = "";
      updateBookingCount(0);
    }

    async function deleteBooking(booking) {
      const confirmationText =
        `${booking.sup}\n` +
        `${booking.appartement}\n` +
        `${formatDate(booking.datum)}\n` +
        `${formatTime(booking.von)}–` +
        `${formatTime(booking.bis)} Uhr\n\n` +
        `Diese Buchung wirklich löschen?`;

      if (!window.confirm(confirmationText)) {
        return;
      }

      try {
        const response = await fetch(
          `/api/admin/delete/${booking.id}`,
          {
            method: "DELETE",
            headers: {
              "X-ADMIN-KEY": adminKey,
            },
          }
        );

        const result =
          await response
            .json()
            .catch(() => ({}));

        if (!response.ok) {
          if (response.status === 401) {
            logout();

            throw new Error(
              "Der Admin-Schlüssel ist ungültig."
            );
          }

          throw new Error(
            result.error ||
            result.message ||
            "Die Buchung konnte nicht gelöscht werden."
          );
        }

        await loadBookings();

        showMessage(
          result.message ||
          "Die Buchung wurde gelöscht.",
          "success"
        );
      } catch (error) {
        console.error(error);

        showMessage(
          error.message ||
          "Beim Löschen ist ein Fehler aufgetreten.",
          "error"
        );
      }
    }

    loginButton.addEventListener(
      "click",
      login
    );

    adminKeyInput.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Enter") {
          login();
        }
      }
    );

    filterButton.addEventListener(
      "click",
      applyFilters
    );

    resetButton.addEventListener(
      "click",
      resetFilters
    );

    logoutButton.addEventListener(
      "click",
      logout
    );

    dateFromInput.addEventListener(
      "change",
      applyFilters
    );

    dateToInput.addEventListener(
      "change",
      applyFilters
    );

    apartmentFilter.addEventListener(
      "change",
      applyFilters
    );

    deviceFilter.addEventListener(
      "change",
      applyFilters
    );
  </script>
</body>
</html>
