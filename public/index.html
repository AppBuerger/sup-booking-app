<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buchung für SUP und Boot</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <div class="brand">

        <img
          src="images/Logo_neu_App.png"
          alt="Appartements Bürger"
          class="site-logo"
        >

        <div class="brand-text">
          <p class="hero-eyebrow">Appartements Bürger</p>
          <h1>Buchung für SUP und Boot</h1>
        </div>
      </div>

      <a class="admin-link" href="admin.html">Admin</a>
    </div>
  </header>

  <main class="page-container">
    <section class="booking-panel">
      <div class="section-heading">
        <p class="eyebrow">Reservierung</p>
        <h2>Gerät buchen</h2>
        <p>
          Wähle das gewünschte Gerät sowie Datum und Uhrzeit aus.
        </p>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="bookingForm">

        <div class="form-group">
          <label for="apartment">Appartement</label>
          <select id="apartment" required>
            <option value="">Appartement wählen</option>
            <option>Top 1</option>
            <option>Top 2</option>
            <option>Top 3</option>
            <option>Top 4</option>
            <option>Top 5</option>
            <option>Top 11</option>
            <option>Top 12</option>
            <option>Top 13</option>
            <option>Top 14</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sup">SUP oder Boot</label>
          <select id="sup" required></select>
        </div>

        <div class="device-preview">
          <div class="device-image-placeholder">
            <span id="devicePreviewText">SUP auswählen</span>
          </div>
        </div>

        <div class="form-group">
          <label for="date">Datum</label>
          <input type="date" id="date" required>
        </div>

        <div class="time-grid">
          <div class="form-group">
            <label for="fromTime">Von</label>
            <select id="fromTime" required>
              <option value="">Zeit wählen</option>
            </select>
          </div>

          <div class="form-group">
            <label for="toTime">Bis</label>
            <select id="toTime" required>
              <option value="">Zeit wählen</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submitButton">
          Jetzt buchen
        </button>
      </form>
    </section>

    <section class="bookings-panel">
      <div class="section-heading">
        <p class="eyebrow">Übersicht</p>
        <h2>Bestehende Buchungen</h2>
        <p>
          Bereits belegte Zeiten werden hier nach Datum angezeigt.
        </p>
      </div>

      <div id="bookings" class="bookings-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      SUP-Verleih für Gäste der Appartements Bürger.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
