<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SUP Admin</title>

  <style>
    :root {
      --background: #f3f7f8;
      --surface: #ffffff;
      --primary: #176b75;
      --primary-dark: #10545c;
      --text: #18323a;
      --muted: #64777d;
      --border: #d9e3e6;
      --danger: #b42318;
      --danger-dark: #8f1c13;
      --success-background: #eaf7ef;
      --error-background: #fdeceb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    .admin-container {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .admin-header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .panel {
      padding: 24px;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(24, 50, 58, 0.08);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .login-panel {
      max-width: 420px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      min-height: 43px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(23, 107, 117, 0.18);
      border-color: var(--primary);
    }

    button {
      min-height: 42px;
      padding: 9px 15px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .primary-button {
      color: #fff;
      background: var(--primary);
    }

    .primary-button:hover {
      background: var(--primary-dark);
    }

    .secondary-button {
      color: var(--text);
      background: #e7eef0;
    }

    .secondary-button:hover {
      background: #dce6e8;
    }

    .delete-button {
      min-height: 36px;
      padding: 7px 11px;
      color: #fff;
      background: var(--danger);
    }

    .delete-button:hover {
      background: var(--danger-dark);
    }

    .login-actions,
    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(160px, 1fr));
      gap: 16px;
    }

    .bookings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 15px;
    }

    .bookings-header h2 {
      margin: 0;
    }

    .booking-count {
      padding: 7px 11px;
      border-radius: 999px;
      background: #e6f1f3;
      color: var(--primary-dark);
      font-weight: 700;
      white-space: nowrap;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #edf3f4;
      color: #334d54;
      font-size: 14px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #f8fbfb;
    }

    .device-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      background: #e7eef0;
    }

    .device-sup-1 {
      background: #dceeff;
    }

    .device-sup-2 {
      background: #dcf5e6;
    }

    .device-ruderboot {
      background: #fff0c7;
    }

    .device-paddelboot {
      background: #ffe1d4;
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 10px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: var(--success-background);
      color: #1d6b3a;
    }

    .message.error {
      background: var(--error-background);
      color: #a01f18;
    }

    .loading {
      padding: 25px;
      text-align: center;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 850px) {
      body {
        padding: 15px;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .filters {
        grid-template-columns:
          repeat(2, minmax(150px, 1fr));
      }
    }

    @media (max-width: 560px) {
      .panel {
        padding: 17px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .bookings-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .login-actions button,
      .filter-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="admin-container">
    <header class="admin-header">
      <div>
        <h1>SUP Admin</h1>
        <p>
          Buchungen verwalten und später auswerten
        </p>
      </div>
    </header>

    <div id="message" class="message"></div>

    <section
      id="loginPanel"
      class="panel login-panel"
    >
      <h2>Admin-Login</h2>

      <div class="form-group">
        <label for="adminKey">
          Admin-Schlüssel
        </label>

        <input
          id="adminKey"
          type="password"
          autocomplete="current-password"
          placeholder="Admin-Schlüssel eingeben"
        >
      </div>

      <div class="login-actions">
        <button
          id="loginButton"
          type="button"
          class="primary-button"
          onclick="login()"
        >
          Anmelden
        </button>
      </div>
    </section>

    <div id="adminArea" class="hidden">
      <section class="panel">
        <h2>Buchungen filtern</h2>

        <div class="filters">
          <div class="form-group">
            <label for="dateFrom">
              Datum von
            </label>

            <input
              id="dateFrom"
              type="date"
            >
          </div>

          <div class="form-group">
            <label for="dateTo">
              Datum bis
            </label>

            <input
              id="dateTo"
              type="date"
            >
          </div>

          <div class="form-group">
            <label for="apartmentFilter">
              Appartement
            </label>

            <select id="apartmentFilter">
              <option value="">
                Alle Appartements
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="deviceFilter">
              Gerät
            </label>

            <select id="deviceFilter">
              <option value="">
                Alle Geräte
              </option>
            </select>
          </div>
        </div>

        <div class="filter-actions">
          <button
            id="filterButton"
            type="button"
            class="primary-button"
          >
            Filter anwenden
          </button>

          <button
            id="resetButton"
            type="button"
            class="secondary-button"
          >
            Filter zurücksetzen
          </button>

          <button
            id="logoutButton"
            type="button"
            class="secondary-button"
          >
            Abmelden
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="bookings-header">
          <h2>Alle Buchungen</h2>

          <span
            id="bookingCount"
            class="booking-count"
          >
            0 Buchungen
          </span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Datum</th>
                <th>Zeit</th>
                <th>Appartement</th>
                <th>Gerät</th>
                <th>Aktion</th>
              </tr>
            </thead>

            <tbody id="bookingTableBody">
              <tr>
                <td colspan="5" class="loading">
                  Buchungen werden geladen …
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="bookings-header">
          <h2>Abrechnung</h2>

          <span
            id="billingTotal"
            class="booking-count"
          >
            € 0,00
          </span>
        </div>

        <div class="filters">
          <div class="form-group">
            <label for="billingApartment">
              Appartement
            </label>

            <select id="billingApartment">
              <option value="">
                Appartement auswählen
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="billingDateFrom">
              Aufenthalt von
            </label>

            <input
              id="billingDateFrom"
              type="date"
            >
          </div>

          <div class="form-group">
            <label for="billingDateTo">
              Aufenthalt bis
            </label>

            <input
              id="billingDateTo"
              type="date"
            >
          </div>
        </div>

        <div class="filter-actions">
          <button
            id="calculateBillingButton"
            type="button"
            class="primary-button"
          >
            Abrechnung berechnen
          </button>

          <button
            id="resetBillingButton"
            type="button"
            class="secondary-button"
          >
            Abrechnung zurücksetzen
          </button>

          <button
            id="printBillingButton"
            type="button"
            class="secondary-button"
            disabled
          >
            Abrechnung drucken / PDF
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Datum</th>
                <th>Zeit</th>
                <th>Gerät</th>
                <th>Dauer</th>
                <th>Betrag</th>
              </tr>
            </thead>

            <tbody id="billingTableBody">
              <tr>
                <td colspan="5" class="empty-state">
                  Bitte Appartement und Aufenthaltszeitraum auswählen.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    const loginPanel =
      document.getElementById("loginPanel");

    const adminArea =
      document.getElementById("adminArea");

    const adminKeyInput =
      document.getElementById("adminKey");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const filterButton =
      document.getElementById("filterButton");

    const resetButton =
      document.getElementById("resetButton");

    const dateFromInput =
      document.getElementById("dateFrom");

    const dateToInput =
      document.getElementById("dateTo");

    const apartmentFilter =
      document.getElementById("apartmentFilter");

    const deviceFilter =
      document.getElementById("deviceFilter");

    const bookingTableBody =
      document.getElementById("bookingTableBody");

    const bookingCount =
      document.getElementById("bookingCount");

    const messageBox =
      document.getElementById("message");
    const billingApartment =
      document.getElementById("billingApartment");

    const billingDateFrom =
      document.getElementById("billingDateFrom");

    const billingDateTo =
      document.getElementById("billingDateTo");

    const calculateBillingButton =
      document.getElementById("calculateBillingButton");

    const resetBillingButton =
      document.getElementById("resetBillingButton");
    
    const printBillingButton =
      document.getElementById("printBillingButton");  

    const billingTableBody =
      document.getElementById("billingTableBody");

    const billingTotal =
      document.getElementById("billingTotal");
   
    const billingApartments = [
      "Top 1",
      "Top 2",
      "Top 3",
      "Top 4",
      "Top 5",
      "Top 11",
      "Top 12",
      "Top 13",
      "Top 14",
    ];

    billingApartments.forEach((apartment) => {
      const option = document.createElement("option");

      option.value = apartment;
      option.textContent = apartment;

      billingApartment.appendChild(option);
  });

    let adminKey = "";
    let allBookings = [];
    let messageTimer;

    function showMessage(
      text,
      type = "success"
    ) {
      clearTimeout(messageTimer);

      messageBox.textContent = text;
      messageBox.className =
        `message show ${type}`;

      messageTimer = setTimeout(() => {
        messageBox.className = "message";
        messageBox.textContent = "";
      }, 5000);
    }

    function getDateValue(value) {
      if (!value) {
        return "";
      }

      return String(value).split("T")[0];
    }

    function formatDate(value) {
      const dateValue = getDateValue(value);

      if (!dateValue) {
        return "";
      }

      const [year, month, day] =
        dateValue.split("-");

      return `${day}.${month}.${year}`;
    }

    function formatTime(value) {
      if (!value) {
        return "";
      }

      return String(value).slice(0, 5);
    }

    function timeToMinutes(value) {
     if (!value) {
      return 0;
      }

      const [hours, minutes] =
        String(value)
          .slice(0, 5)
          .split(":")
          .map(Number);

      return hours * 60 + minutes;
    }

    function calculateBookingPrice(booking) {
      const startMinutes =
        timeToMinutes(booking.von);

      const endMinutes =
        timeToMinutes(booking.bis);

      const durationMinutes =
        endMinutes - startMinutes;

      if (durationMinutes < 60) {
        return 0;
      }

      let firstHourPrice = 0;
      let additionalHalfHourPrice = 0;

      switch (booking.sup) {
        case "SUP 1":
        case "SUP 2":
          firstHourPrice = 5;
          additionalHalfHourPrice = 2.5;
        break;

        case "Ruderboot":
          firstHourPrice = 15;
          additionalHalfHourPrice = 7.5;
        break;

        case "Paddelboot":
          firstHourPrice = 10;
          additionalHalfHourPrice = 5;
        break;

        default:
          return 0;
      }

      const additionalMinutes =
        Math.max(0, durationMinutes - 60);

      const additionalHalfHours =
        Math.ceil(additionalMinutes / 30);

      return (
        firstHourPrice +
        additionalHalfHours *
          additionalHalfHourPrice
    );
  }

    function formatCurrency(value) {
      return new Intl.NumberFormat(
        "de-AT",
        {
          style: "currency",
          currency: "EUR",
        }
      ).format(value);
    }

    function formatDuration(minutes) {
      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;

      if (remainingMinutes === 0) {
        return `${hours} Std.`;
      }   

      return `${hours} Std. ${remainingMinutes} Min.`;
  }

    function calculateBilling() {
      const selectedApartment =
        billingApartment.value;

      const dateFrom =
        billingDateFrom.value;

      const dateTo =
        billingDateTo.value;

      if (
        !selectedApartment ||
        !dateFrom ||
        !dateTo
    ) {
        alert(
          "Bitte Appartement und Aufenthaltszeitraum auswählen."
        );

        return;
      }

      if (dateFrom > dateTo) {
        alert(
          "Das Von-Datum darf nicht nach dem Bis-Datum liegen."
        );

        return;
    }

      const billingBookings =
        allBookings
          .filter((booking) => {
            const bookingDate =
              String(booking.datum).slice(0, 10);

            return (
              booking.appartement ===
                selectedApartment &&
              bookingDate >= dateFrom &&
              bookingDate <= dateTo
          );
        })
        .sort((a, b) => {
          const dateComparison =
            String(a.datum).localeCompare(
              String(b.datum)
            );

          if (dateComparison !== 0) {
            return dateComparison;
          }

          return String(a.von).localeCompare(
            String(b.von)
          );
        });

      if (billingBookings.length === 0) {
        billingTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">
              Für diesen Aufenthalt wurden keine Buchungen gefunden.
            </td>
          </tr>
      `;

        billingTotal.textContent =
          formatCurrency(0);
          printBillingButton.disabled = true;

        return;
      }

      let total = 0;

      billingTableBody.innerHTML =
        billingBookings
          .map((booking) => {
            const startMinutes =
              timeToMinutes(booking.von);

            const endMinutes =
              timeToMinutes(booking.bis);

            const durationMinutes =
              endMinutes - startMinutes;

            const price =
              calculateBookingPrice(booking);

            total += price;

            return `
              <tr>
                <td>
                  ${formatDate(booking.datum)}
                </td>

                <td>
                  ${formatTime(booking.von)}
                  –
                  ${formatTime(booking.bis)}
                </td>

                <td>
                  ${booking.sup}
                </td>

                <td>
                  ${formatDuration(
                    durationMinutes
                )}
                </td>

                <td>
                  ${formatCurrency(price)}
                </td>
              </tr>
            `;
        })
        .join("");

      billingTotal.textContent =
        formatCurrency(total);
        printBillingButton.disabled = false;
      }

      function resetBilling() {
        billingApartment.value = "";
        billingDateFrom.value = "";
        billingDateTo.value = "";

        billingTotal.textContent =
          formatCurrency(0);

        printBillingButton.disabled = true;  

        billingTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">
              Bitte Appartement und Aufenthaltszeitraum auswählen.
            </td>
          </tr>
        `;
      }

      function printBilling() {
        const selectedApartment =
          billingApartment.value;

        const dateFrom =
          billingDateFrom.value;

        const dateTo =
          billingDateTo.value;

        if (
          !selectedApartment ||
          !dateFrom ||
          !dateTo
      ) {
        alert(
          "Bitte zuerst eine Abrechnung berechnen."
        );

        return;
      }

        const rows =
          billingTableBody.querySelectorAll("tr");

        if (
          rows.length === 0 ||
          billingTableBody.querySelector(
            ".empty-state"
          )
      ) {
        alert(
          "Für diese Auswahl ist keine Abrechnung vorhanden."
        );

        return;
    }

        const printWindow =
        window.open("", "_blank");

      if (!printWindow) {
        alert(
          "Das Druckfenster wurde blockiert. Bitte Pop-ups für diese Seite erlauben."
        );

        return;
    }

      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="de">
          <head>
            <meta charset="UTF-8">

            <title>
              Abrechnung ${selectedApartment}
            </title>

            <style>
              body {
                padding: 30px;
                font-family: Arial, sans-serif;
                color: #18323a;
              }

              h1 {
                margin-bottom: 8px;
              }

              .billing-info {
                margin-bottom: 24px;
                line-height: 1.6;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th,
              td {
                padding: 10px;
                border: 1px solid #cfdadd;
                text-align: left;
              }

              th {
                background: #edf3f4;
              }

              .total {
                margin-top: 24px;
                text-align: right;
                font-size: 22px;
                font-weight: bold;
              }

              .footer {
                margin-top: 40px;
                color: #64777d;
                font-size: 12px;
              }

              @media print {
                body {
                  padding: 0;
                }
              }
            </style>
          </head>

          <body>
            <h1>Abrechnung Bootsverleih</h1>

            <div class="billing-info">
              <strong>Appartement:</strong>
                ${selectedApartment}
              <br>

            <strong>Aufenthalt:</strong>
              ${formatDate(dateFrom)}
              bis
              ${formatDate(dateTo)}
            </div>

            <table>
              <thead>
                <tr>
                  <th>Datum</th>
                  <th>Zeit</th>
                  <th>Gerät</th>
                  <th>Dauer</th>
                  <th>Betrag</th>
                </tr>
              </thead>

              <tbody>
                ${billingTableBody.innerHTML}
              </tbody>
            </table>

            <div class="total">
              Gesamt:
              ${billingTotal.textContent}
            </div>

            <div class="footer">
              Appartements Bürger
            </div>
          </body>
        </html>
      `);

      printWindow.document.close();

      printWindow.focus();

      setTimeout(() => {
        printWindow.print();
      }, 300);
    }

    function getDeviceClass(deviceName) {
      switch (deviceName) {
        case "SUP 1":
          return "device-sup-1";

        case "SUP 2":
          return "device-sup-2";

        case "Ruderboot":
          return "device-ruderboot";

        case "Paddelboot":
          return "device-paddelboot";

        default:
          return "";
      }
    }

    function createOption(value, text) {
      const option =
        document.createElement("option");

      option.value = value;
      option.textContent = text;

      return option;
    }

    function fillFilterOptions() {
      const selectedApartment =
        apartmentFilter.value;

      const selectedDevice =
        deviceFilter.value;

      const apartments = [
        ...new Set(
          allBookings
            .map((booking) => booking.appartement)
            .filter(Boolean)
        ),
      ].sort((a, b) =>
        String(a).localeCompare(
          String(b),
          "de",
          { numeric: true }
        )
      );

      const devices = [
        ...new Set(
          allBookings
            .map((booking) => booking.sup)
            .filter(Boolean)
        ),
      ].sort((a, b) =>
        String(a).localeCompare(String(b), "de")
      );

      apartmentFilter.innerHTML = "";
      apartmentFilter.appendChild(
        createOption("", "Alle Appartements")
      );

      apartments.forEach((apartment) => {
        apartmentFilter.appendChild(
          createOption(apartment, apartment)
        );
      });

      deviceFilter.innerHTML = "";
      deviceFilter.appendChild(
        createOption("", "Alle Geräte")
      );

      devices.forEach((device) => {
        deviceFilter.appendChild(
          createOption(device, device)
        );
      });

      apartmentFilter.value =
        apartments.includes(selectedApartment)
          ? selectedApartment
          : "";

      deviceFilter.value =
        devices.includes(selectedDevice)
          ? selectedDevice
          : "";
    }

    function getFilteredBookings() {
      const dateFrom = dateFromInput.value;
      const dateTo = dateToInput.value;
      const selectedApartment =
        apartmentFilter.value;

      const selectedDevice =
        deviceFilter.value;

      return allBookings
        .filter((booking) => {
          const bookingDate =
            getDateValue(booking.datum);

          if (
            dateFrom &&
            bookingDate < dateFrom
          ) {
            return false;
          }

          if (
            dateTo &&
            bookingDate > dateTo
          ) {
            return false;
          }

          if (
            selectedApartment &&
            booking.appartement !== selectedApartment
          ) {
            return false;
          }

          if (
            selectedDevice &&
            booking.sup !== selectedDevice
          ) {
            return false;
          }

          return true;
        })
        .sort((a, b) => {
          const dateComparison =
            getDateValue(a.datum).localeCompare(
              getDateValue(b.datum)
            );

          if (dateComparison !== 0) {
            return dateComparison;
          }

          return String(a.von).localeCompare(
            String(b.von)
          );
        });
    }

    function updateBookingCount(count) {
      bookingCount.textContent =
        count === 1
          ? "1 Buchung"
          : `${count} Buchungen`;
    }

    function renderBookings(bookings) {
      bookingTableBody.innerHTML = "";

      updateBookingCount(bookings.length);

      if (bookings.length === 0) {
        const row =
          document.createElement("tr");

        row.innerHTML = `
          <td colspan="5" class="empty-state">
            Für diese Auswahl wurden keine Buchungen gefunden.
          </td>
        `;

        bookingTableBody.appendChild(row);
        return;
      }

      bookings.forEach((booking) => {
        const row =
          document.createElement("tr");

        const dateCell =
          document.createElement("td");

        dateCell.textContent =
          formatDate(booking.datum);

        const timeCell =
          document.createElement("td");

        timeCell.textContent =
          `${formatTime(booking.von)}–` +
          `${formatTime(booking.bis)} Uhr`;

        const apartmentCell =
          document.createElement("td");

        apartmentCell.textContent =
          booking.appartement || "–";

        const deviceCell =
          document.createElement("td");

        const deviceBadge =
          document.createElement("span");

        deviceBadge.className =
          `device-badge ` +
          getDeviceClass(booking.sup);

        deviceBadge.textContent =
          booking.sup || "–";

        deviceCell.appendChild(deviceBadge);

        const actionCell =
          document.createElement("td");

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className =
          "delete-button";

        deleteButton.textContent = "Löschen";

        deleteButton.addEventListener(
          "click",
          () => deleteBooking(booking)
        );

        actionCell.appendChild(deleteButton);

        row.appendChild(dateCell);
        row.appendChild(timeCell);
        row.appendChild(apartmentCell);
        row.appendChild(deviceCell);
        row.appendChild(actionCell);

        bookingTableBody.appendChild(row);
      });
    }

    function applyFilters() {
      if (
        dateFromInput.value &&
        dateToInput.value &&
        dateFromInput.value >
          dateToInput.value
      ) {
        showMessage(
          "Das Von-Datum darf nicht nach dem Bis-Datum liegen.",
          "error"
        );

        return;
      }

      renderBookings(getFilteredBookings());
    }

    function resetFilters() {
      dateFromInput.value = "";
      dateToInput.value = "";
      apartmentFilter.value = "";
      deviceFilter.value = "";

      renderBookings(allBookings);
    }

    async function loadBookings() {
      bookingTableBody.innerHTML = `
        <tr>
          <td colspan="5" class="loading">
            Buchungen werden geladen …
          </td>
        </tr>
      `;

      const response =
        await fetch("/api/bookings");

      const result =
        await response
          .json()
          .catch(() => []);

      if (!response.ok) {
        throw new Error(
          result.message ||
          "Die Buchungen konnten nicht geladen werden."
        );
      }

      allBookings =
        Array.isArray(result) ? result : [];

      fillFilterOptions();
      renderBookings(getFilteredBookings());
    }

    async function login() {

      const enteredKey =
        adminKeyInput.value.trim();

      if (!enteredKey) {
        showMessage(
         "Bitte gib den Admin-Schlüssel ein.",
         "error"
       );

       return;
      }

      adminKey = enteredKey;

      loginButton.disabled = true;
      loginButton.textContent =
        "Anmeldung läuft …";

      try {
        const response = await fetch(
          "/api/admin/check",
          {
            headers: {
              "X-ADMIN-KEY": adminKey,
            },
          }
      );

      const result =
        await response
          .json()
          .catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result.error ||
          "Der Admin-Schlüssel ist ungültig."
        );
      }

      await loadBookings();

      loginPanel.classList.add("hidden");
      adminArea.classList.remove("hidden");
    } catch (error) {
      console.error(error);

      showMessage(
        error.message ||
        "Der Adminbereich konnte nicht geladen werden.",
        "error"
      );
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Anmelden";
    }
  }


    function logout() {
      adminKey = "";
      adminKeyInput.value = "";

      adminArea.classList.add("hidden");
      loginPanel.classList.remove("hidden");

      allBookings = [];
      bookingTableBody.innerHTML = "";
      updateBookingCount(0);
    }

    async function deleteBooking(booking) {
      const confirmationText =
        `${booking.sup}\n` +
        `${booking.appartement}\n` +
        `${formatDate(booking.datum)}\n` +
        `${formatTime(booking.von)}–` +
        `${formatTime(booking.bis)} Uhr\n\n` +
        `Diese Buchung wirklich löschen?`;

      if (!window.confirm(confirmationText)) {
        return;
      }

      try {
        const response = await fetch(
          `/api/admin/delete/${booking.id}`,
          {
            method: "DELETE",
            headers: {
              "X-ADMIN-KEY": adminKey,
            },
          }
        );

        const result =
          await response
            .json()
            .catch(() => ({}));

        if (!response.ok) {
          if (response.status === 401) {
            logout();

            throw new Error(
              "Der Admin-Schlüssel ist ungültig."
            );
          }

          throw new Error(
            result.error ||
            result.message ||
            "Die Buchung konnte nicht gelöscht werden."
          );
        }

        await loadBookings();

        showMessage(
          result.message ||
          "Die Buchung wurde gelöscht.",
          "success"
        );
      } catch (error) {
        console.error(error);

        showMessage(
          error.message ||
          "Beim Löschen ist ein Fehler aufgetreten.",
          "error"
        );
      }
    }

    adminKeyInput.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Enter") {
          login();
        }
      }
    );

    filterButton.addEventListener(
      "click",
      applyFilters
    );

    resetButton.addEventListener(
      "click",
      resetFilters
    );

    logoutButton.addEventListener(
      "click",
      logout
    );

    dateFromInput.addEventListener(
      "change",
      applyFilters
    );

    dateToInput.addEventListener(
      "change",
      applyFilters
    );

    apartmentFilter.addEventListener(
      "change",
      applyFilters
    );

    deviceFilter.addEventListener(
      "change",
      applyFilters
    );

    calculateBillingButton.addEventListener(
      "click",
      calculateBilling
    );

    resetBillingButton.addEventListener(
      "click",
      resetBilling
    );

    printBillingButton.addEventListener(
      "click",
      printBilling
    );

    billingApartment.addEventListener(
      "change",
      () => {
        printBillingButton.disabled = true;
      }
    );

    billingDateFrom.addEventListener(
      "change",
      () => {
        printBillingButton.disabled = true;
      }
    );

    billingDateTo.addEventListener(
      "change",
      () => {
        printBillingButton.disabled = true;
      }
  );
  </script>
</body>
</html>
